<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>حضور الطلاب - متوافق مع AppSheet</title>
    <meta name="description" content="تطبيق إدارة وتسجيل حضور وغياب الطلاب بالباركود وQR ومزامنة جداول البيانات وتنبيهات أولياء الأمور." />
    <meta property="og:title" content="حضور الطلاب - متوافق مع AppSheet" />
    <meta property="og:description" content="تطبيق إدارة وتسجيل حضور وغياب الطلاب بالباركود وQR ومزامنة جداول البيانات وتنبيهات أولياء الأمور." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Icons & Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Web App Manifest (Primary file + embedded Data URL fallback) -->
    <link rel="manifest" href="/manifest.json" id="manifest-link" />
    
    <!-- Theme & Mobile App Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="background-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="حضور الطلاب" />
    <meta name="application-name" content="نظام حضور المحاضرات الذكي" />
    <meta name="msapplication-TileColor" content="#0f172a" />

    <!-- Early BeforeInstallPrompt Event Capture -->
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(event) {
        event.preventDefault();
        window.deferredPWAInstallPrompt = event;
        console.log('[PWA] beforeinstallprompt captured early in head');
        window.dispatchEvent(new CustomEvent('pwa-installable', { detail: event }));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredPWAInstallPrompt = null;
        console.log('[PWA] Application successfully installed');
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>

    <!-- Automatic Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] Service Worker active with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
